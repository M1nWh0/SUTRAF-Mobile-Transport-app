<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#064e3b" />
		<meta name="description" content="SUTRAF - Public Transportation Application for Algeria" />
		<title>SUTRAF | Transport Urbain & Interwilayas</title>
		<script>
			// Early restoration of locale and direction to avoid flicker
			try {
				var savedLocale = localStorage.getItem('sutraf_locale');
				if (savedLocale === 'ar') {
					document.documentElement.lang = 'ar';
					document.documentElement.dir = 'rtl';
				} else {
					document.documentElement.lang = 'en';
					document.documentElement.dir = 'ltr';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-slate-100 dark:bg-slate-950 font-sans antialiased text-foreground">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
